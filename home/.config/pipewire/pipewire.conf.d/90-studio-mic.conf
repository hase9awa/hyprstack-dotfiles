# Persistent virtual microphone for the Carla-processed signal.
#
# "Studio Mic Input" is an Audio/Sink that accepts Carla's output.
# "Studio Mic" is an Audio/Source visible to OBS, browsers, Discord, etc.
# The internal loopback passes audio from the sink side to the source side.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Studio Mic Bridge"
      audio.position = [ FL FR ]

      capture.props = {
        node.name = "studio_mic_input"
        node.description = "Studio Mic Input"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        node.passive = true
      }

      playback.props = {
        node.name = "studio_mic"
        node.description = "Studio Mic"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
        node.passive = true
      }
    }
  }
]
